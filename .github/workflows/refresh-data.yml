name: Refresh data feeds and deploy

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC; weekly/monthly/annual feeds self-schedule via data/meta.json
  workflow_dispatch:
    inputs:
      force:
        description: 'Run every feed now, ignoring cadence'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Run pipeline
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}   # "Organisation Name contact@domain" (required by SEC)
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}       # optional; FRED feed is skipped without it
        run: python scripts/pipeline.py ${{ inputs.force && '--force' || '' }}
      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data assets/js/data.js
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: automated refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
  deploy:
    needs: refresh
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
